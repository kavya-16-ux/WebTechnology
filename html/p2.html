<!DOCTYPE html>
<head>
    <title>Hyperlink Example</title>
</head>
<body>
    <h1>Hyperlinks Without & With Line Breaks</h1>

    <!-- Hyperlinks without line breaks -->
    <div>
        <h2>Without Line Breaks:</h2>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>

    <!-- Hyperlinks with line breaks -->
    <div>
        <h2>With Line Breaks:</h2>
        <a href="#">Home</a><br>
        <a href="#">About</a><br>
        <a href="#">Contact</a><br>
    </div>
</body>
</html>
