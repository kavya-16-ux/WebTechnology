<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h2>Captch Form</h2>
        <label>Enter Captch</label>
        <input type ="text">
        <br><br>
        <button type="submit">Submit</button>
        <button type ="reset">Cancel</button>
    </form>
    <br><br><hr>
    <form>
        <h2>After link label to textbox</h2>
        <label for="Captch">Enter Captch</label>
        <input type ="text" id ="Captch" name="Captch">
        <br><br>
        <button type="submit">Submit</button>
        <button type ="reset">Cancel</button>
    </form>
    <br><br><hr>
    <form>
        <h2>Mandatory submit the Captch</h2>
        <label for="Captch">Enter Captch <span style="color: brown;">*</span></label>
        <input type ="text" id ="Captch" name="Captch" placeholder="Enter the Captch"
         title="Enter the 6 character only" required>
        <br><br>
        <button type="submit">Submit</button>
        <button type ="reset">Cancel</button>
    </form>
</body>
</html>
